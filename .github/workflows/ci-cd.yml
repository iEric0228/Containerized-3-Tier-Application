name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment Action'
        required: true
        default: 'deploy-test-destroy'
        type: choice
        options:
          - 'deploy-test-destroy'
          - 'deploy-only'
          - 'destroy-only'
          - 'test-only'
      skip_destroy:
        description: 'Skip destroy step (useful for debugging)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  TF_WORKSPACE: dev

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.action != 'destroy-only' || 
      github.event_name == 'push' || 
      github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Test Backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm test
        env:
          CI: true

      - name: Install and Test Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watchAll=false --coverage --passWithNoTests
        env:
          CI: true

  terraform-check:
    name: Terraform Validation
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.action != 'destroy-only' || 
      github.event_name == 'push' || 
      github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Format Check
        working-directory: terraform/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate

  deploy:
    name: Deploy Infrastructure
    needs: [test-and-build, terraform-check]
    runs-on: ubuntu-latest
    if: |
      (github.event.inputs.action == 'deploy-test-destroy' || 
       github.event.inputs.action == 'deploy-only' ||
       github.event_name == 'push') &&
      github.ref == 'refs/heads/main'

    outputs:
      frontend_ecr: ${{ steps.tf-outputs.outputs.frontend_ecr }}
      backend_ecr: ${{ steps.tf-outputs.outputs.backend_ecr }}
      cluster_name: ${{ steps.tf-outputs.outputs.cluster_name }}
      deployment_successful: ${{ steps.deploy-check.outputs.success }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::125156866057:role/github-OICD
          role-session-name: 3tier-app-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Recover Deleted Secrets
        working-directory: terraform/environments/dev
        continue-on-error: true
        run: |
          echo "Attempting to recover any secrets scheduled for deletion..."
          aws secretsmanager restore-secret --secret-id dev-db-password --region $AWS_REGION 2>/dev/null && echo "Restored dev-db-password" || echo "dev-db-password not in deletion state"
          aws secretsmanager restore-secret --secret-id dev-db-username --region $AWS_REGION 2>/dev/null && echo "Restored dev-db-username" || echo "dev-db-username not in deletion state"
          aws secretsmanager restore-secret --secret-id dev-grafana-admin-password --region $AWS_REGION 2>/dev/null && echo "Restored dev-grafana-admin-password" || echo "dev-grafana-admin-password not in deletion state"

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false

      - name: Import Existing Resources
        working-directory: terraform/environments/dev
        continue-on-error: true
        run: |
          echo "Running resource import script..."
          chmod +x auto-import-resources.sh
          ./auto-import-resources.sh || echo "Some imports failed, continuing..."

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve tfplan

      - name: Get Infrastructure Outputs
        id: tf-outputs
        working-directory: terraform/environments/dev
        run: |
          FRONTEND_ECR=$(terraform output -raw frontend_repository_url 2>/dev/null || echo "")
          BACKEND_ECR=$(terraform output -raw backend_repository_url 2>/dev/null || echo "")
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "dev")
          ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
          
          # Fall back to AWS CLI if outputs aren't available
          if [ -z "$FRONTEND_ECR" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            FRONTEND_ECR="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dev-frontend"
            BACKEND_ECR="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dev-backend"
          fi
          
          echo "frontend_ecr=${FRONTEND_ECR}" >> $GITHUB_OUTPUT
          echo "backend_ecr=${BACKEND_ECR}" >> $GITHUB_OUTPUT
          echo "cluster_name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "alb_dns=${ALB_DNS}" >> $GITHUB_OUTPUT
          
          echo "ECR Repositories:"
          echo "  Frontend: ${FRONTEND_ECR}"
          echo "  Backend: ${BACKEND_ECR}"
          echo "  Cluster: ${CLUSTER_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Images
        run: |
          IMAGE_TAG="${{ github.sha }}"
          
          # Build and push frontend
          docker buildx build \
            --platform linux/amd64 \
            --tag "${{ steps.tf-outputs.outputs.frontend_ecr }}:${IMAGE_TAG}" \
            --tag "${{ steps.tf-outputs.outputs.frontend_ecr }}:latest" \
            --push \
            --cache-from type=registry,ref=${{ steps.tf-outputs.outputs.frontend_ecr }}:latest \
            --cache-to type=inline \
            ./frontend &
          
          # Build and push backend
          docker buildx build \
            --platform linux/amd64 \
            --tag "${{ steps.tf-outputs.outputs.backend_ecr }}:${IMAGE_TAG}" \
            --tag "${{ steps.tf-outputs.outputs.backend_ecr }}:latest" \
            --push \
            --cache-from type=registry,ref=${{ steps.tf-outputs.outputs.backend_ecr }}:latest \
            --cache-to type=inline \
            ./backend &
          
          wait
          echo "Images built and pushed with tags: ${IMAGE_TAG}, latest"

      - name: Deploy ECS Services
        run: |
          CLUSTER_NAME="${{ steps.tf-outputs.outputs.cluster_name }}"
          
          echo "Deploying application services..."
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "dev-frontend" --force-new-deployment --no-cli-pager &
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "dev-backend" --force-new-deployment --no-cli-pager &
          wait
          
          echo "Deploying monitoring services..."
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "dev-prometheus" --force-new-deployment --no-cli-pager 2>/dev/null || echo "Prometheus service not ready yet"
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "dev-grafana" --force-new-deployment --no-cli-pager 2>/dev/null || echo "Grafana service not ready yet"
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "dev-loki" --force-new-deployment --no-cli-pager 2>/dev/null || echo "Loki service not ready yet"

      - name: Wait for Services
        id: deploy-check
        run: |
          CLUSTER_NAME="${{ steps.tf-outputs.outputs.cluster_name }}"
          
          echo "Waiting for application services to stabilize (up to 10 minutes)..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "dev-frontend" "dev-backend" \
            --cli-connect-timeout 600 \
            --cli-read-timeout 600 && echo "Application services stable" || echo "Application services may still be starting"
          
          echo "Waiting for monitoring services..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "dev-prometheus" "dev-grafana" "dev-loki" \
            --cli-connect-timeout 300 \
            --cli-read-timeout 300 2>/dev/null && echo "Monitoring services stable" || echo "Monitoring services may still be starting"
          
          echo "success=true" >> $GITHUB_OUTPUT

  test-deployment:
    name: Test Deployment
    needs: [deploy]
    runs-on: ubuntu-latest
    if: |
      needs.deploy.outputs.deployment_successful == 'true' &&
      (github.event.inputs.action == 'deploy-test-destroy' || 
       github.event.inputs.action == 'deploy-only')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::125156866057:role/github-OICD
          role-session-name: 3tier-app-test-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Get ALB DNS Names
        id: get-alb
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false
          ALB_DNS=$(terraform output -raw alb_dns_name)
          MONITORING_ALB_DNS=$(terraform output -raw monitoring_alb_dns 2>/dev/null || echo "")
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "monitoring_alb_dns=$MONITORING_ALB_DNS" >> $GITHUB_OUTPUT

      - name: Test Endpoints
        run: |
          ALB_DNS="${{ steps.get-alb.outputs.alb_dns }}"
          MONITORING_ALB_DNS="${{ steps.get-alb.outputs.monitoring_alb_dns }}"
          
          echo "Testing application at http://$ALB_DNS"
          
          # Test frontend
          for i in {1..30}; do
            if curl -f -s "http://$ALB_DNS" > /dev/null; then
              echo "Frontend is responding"
              break
            fi
            echo "Frontend not ready, retry $i/30..."
            sleep 10
          done
          
          # Test backend API
          for i in {1..30}; do
            if curl -f -s "http://$ALB_DNS/api/health" > /dev/null; then
              echo "Backend API is responding"
              break
            fi
            echo "Backend API not ready, retry $i/30..."
            sleep 10
          done
          
          # Test monitoring if available
          if [ -n "$MONITORING_ALB_DNS" ]; then
            echo ""
            echo "Testing monitoring at http://$MONITORING_ALB_DNS"
            
            for i in {1..10}; do
              if curl -f -s "http://$MONITORING_ALB_DNS/prometheus/-/healthy" > /dev/null; then
                echo "Prometheus is responding"
                break
              fi
              echo "Prometheus not ready, retry $i/10..."
              sleep 10
            done
            
            for i in {1..10}; do
              if curl -f -s "http://$MONITORING_ALB_DNS/grafana/api/health" > /dev/null; then
                echo "Grafana is responding"
                break
              fi
              echo "Grafana not ready, retry $i/10..."
              sleep 10
            done
          fi
          
          echo "Deployment tests completed"

  destroy:
    name: Destroy Infrastructure
    needs: [deploy, test-deployment]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event.inputs.action == 'deploy-test-destroy' &&
      github.event.inputs.skip_destroy != 'true' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'failure')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::125156866057:role/github-OICD
          role-session-name: 3tier-app-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false

      - name: Import Existing Resources
        working-directory: terraform/environments/dev
        continue-on-error: true
        run: |
          echo "Running resource import before destroy..."
          chmod +x auto-import-resources.sh
          ./auto-import-resources.sh || echo "Some imports failed, continuing..."

      - name: Clean ECR Repositories
        continue-on-error: true
        run: |
          echo "Cleaning up ECR repositories..."
          
          FRONTEND_IMAGES=$(aws ecr list-images --repository-name dev-frontend --query 'imageIds[*]' --output json 2>/dev/null || echo '[]')
          BACKEND_IMAGES=$(aws ecr list-images --repository-name dev-backend --query 'imageIds[*]' --output json 2>/dev/null || echo '[]')
          
          if [ "$FRONTEND_IMAGES" != "[]" ]; then
            aws ecr batch-delete-image --repository-name dev-frontend --image-ids "$FRONTEND_IMAGES" --no-cli-pager || true
          fi
          
          if [ "$BACKEND_IMAGES" != "[]" ]; then
            aws ecr batch-delete-image --repository-name dev-backend --image-ids "$BACKEND_IMAGES" --no-cli-pager || true
          fi
          
          echo "ECR cleanup completed"

      - name: Terraform Destroy
        working-directory: terraform/environments/dev
        run: |
          echo "Destroying infrastructure..."
          terraform destroy -auto-approve
          echo "Infrastructure destroyed"

  destroy-only:
    name: Destroy Only
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy-only'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::125156866057:role/github-OICD
          role-session-name: 3tier-app-destroy-only-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false

      - name: Import Existing Resources
        working-directory: terraform/environments/dev
        continue-on-error: true
        run: |
          echo "Running resource import before destroy..."
          chmod +x auto-import-resources.sh
          ./auto-import-resources.sh || echo "Some imports failed, continuing..."

      - name: Clean ECR and Destroy
        working-directory: terraform/environments/dev
        run: |
          echo "Cleaning up ECR repositories..."
          
          FRONTEND_IMAGES=$(aws ecr list-images --repository-name dev-frontend --query 'imageIds[*]' --output json 2>/dev/null || echo '[]')
          BACKEND_IMAGES=$(aws ecr list-images --repository-name dev-backend --query 'imageIds[*]' --output json 2>/dev/null || echo '[]')
          
          if [ "$FRONTEND_IMAGES" != "[]" ]; then
            aws ecr batch-delete-image --repository-name dev-frontend --image-ids "$FRONTEND_IMAGES" --no-cli-pager || true
          fi
          
          if [ "$BACKEND_IMAGES" != "[]" ]; then
            aws ecr batch-delete-image --repository-name dev-backend --image-ids "$BACKEND_IMAGES" --no-cli-pager || true
          fi
          
          echo "Destroying infrastructure..."
          terraform destroy -auto-approve
          echo "Infrastructure destroyed"

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [test-and-build, terraform-check, deploy, test-deployment, destroy, destroy-only]

    steps:
      - name: Generate Summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test and Build | ${{ needs.test-and-build.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Check | ${{ needs.terraform-check.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Deployment | ${{ needs.test-deployment.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destroy | ${{ needs.destroy.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destroy Only | ${{ needs.destroy-only.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
