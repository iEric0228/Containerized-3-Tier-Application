# CI/CD Pipeline
# - Push to main / PR: test → build → push ECR → deploy ECS (no infrastructure changes)
# - Manual trigger: optionally deploy/destroy infrastructure via Terraform
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN            - IAM role for OIDC federation
#   TF_VAR_db_password      - RDS database password
#   TF_VAR_grafana_admin_password - Grafana admin password
#
# Required GitHub Environments:
#   dev  - no approval required
#   prod - requires manual approval

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy-app'
        type: choice
        options:
          - 'deploy-app'
          - 'deploy-infrastructure'
          - 'deploy-all'
          - 'destroy'
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'prod'
      skip_tests:
        description: 'Skip unit tests'
        required: false
        default: false
        type: boolean
      skip_monitoring:
        description: 'Skip monitoring stack'
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: 'Force rebuild Docker images (ignore cache)'
        required: false
        default: false
        type: boolean
      force_destroy_rds:
        description: 'Force destroy RDS without final snapshot (dev only)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

permissions:
  id-token: write
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. TEST — runs on every push, PR, and manual
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.action != 'destroy' &&
      github.event.inputs.skip_tests != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test Backend
        working-directory: backend
        run: npm ci && npm run lint && npm test
        env:
          CI: true

      - name: Test Frontend
        working-directory: frontend
        run: npm ci && npm test -- --watchAll=false --coverage --passWithNoTests
        env:
          CI: true

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'destroy'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: Validate
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  # ──────────────────────────────────────────────
  # 2. BUILD & PUSH — on push to main or manual (not PR, not destroy)
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    needs: [test]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event.inputs.action != 'destroy' &&
      github.event.inputs.action != 'deploy-infrastructure'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      frontend_ecr: ${{ steps.meta.outputs.frontend_ecr }}
      backend_ecr: ${{ steps.meta.outputs.backend_ecr }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          FRONTEND_ECR="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ env.ENVIRONMENT }}-frontend"
          BACKEND_ECR="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ env.ENVIRONMENT }}-backend"
          IMAGE_TAG="${{ github.sha }}"
          echo "frontend_ecr=${FRONTEND_ECR}" >> $GITHUB_OUTPUT
          echo "backend_ecr=${BACKEND_ECR}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.frontend_ecr }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.backend_ecr }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 3. DEPLOY APP — update ECS with new images (no Terraform)
  #    Runs on push to main + manual deploy-app/deploy-all
  # ──────────────────────────────────────────────
  deploy-app:
    name: Deploy Application
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: needs.build-and-push.result == 'success'
    outputs:
      alb_dns: ${{ steps.deploy.outputs.alb_dns }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy new task definitions
        id: deploy
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          FRONTEND_ECR: ${{ needs.build-and-push.outputs.frontend_ecr }}
          BACKEND_ECR: ${{ needs.build-and-push.outputs.backend_ecr }}
        run: |
          set -e
          CLUSTER="${{ env.ENVIRONMENT }}"

          deploy_service() {
            local SERVICE="$1"
            local FAMILY="$2"
            local NEW_IMAGE="$3"

            TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition "$FAMILY" --region "$AWS_REGION" --query 'taskDefinition')

            UPDATED=$(echo "$TASK_DEF_JSON" | jq --arg IMG "$NEW_IMAGE" '
              .containerDefinitions |= map(
                if .essential == true then .image = $IMG else . end
              ) |
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            ')

            NEW_ARN=$(echo "$UPDATED" | jq -r '{
              family, networkMode, containerDefinitions, volumes,
              requiresCompatibilities, cpu, memory,
              executionRoleArn, taskRoleArn
            }' | aws ecs register-task-definition \
              --region "$AWS_REGION" \
              --cli-input-json file:///dev/stdin \
              --query 'taskDefinition.taskDefinitionArn' --output text)

            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$SERVICE" \
              --task-definition "$NEW_ARN" \
              --force-new-deployment \
              --region "$AWS_REGION" \
              --no-cli-pager > /dev/null

            echo "Deployed $SERVICE with image $NEW_IMAGE (task: $NEW_ARN)"
          }

          deploy_service "${CLUSTER}-frontend" "${CLUSTER}-frontend" "${FRONTEND_ECR}:${IMAGE_TAG}"
          deploy_service "${CLUSTER}-backend"  "${CLUSTER}-backend"  "${BACKEND_ECR}:${IMAGE_TAG}"

          echo "Waiting for services to stabilize..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "${CLUSTER}-frontend" "${CLUSTER}-backend" \
            --cli-connect-timeout 600 \
            --cli-read-timeout 600 || echo "Services may still be starting"

          ALB_DNS=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" \
            --query "LoadBalancers[?contains(LoadBalancerName,'${CLUSTER}-alb')].DNSName | [0]" --output text)
          echo "alb_dns=${ALB_DNS}" >> $GITHUB_OUTPUT

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag**: \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: ${FRONTEND_ECR}:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: ${BACKEND_ECR}:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: http://${ALB_DNS}" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # 4. DEPLOY INFRASTRUCTURE — Terraform (manual only)
  # ──────────────────────────────────────────────
  deploy-infrastructure:
    name: Deploy Infrastructure
    needs: [test, terraform-validate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.action == 'deploy-infrastructure' || github.event.inputs.action == 'deploy-all') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Block force_destroy_rds in production
        if: github.event.inputs.force_destroy_rds == 'true' && github.event.inputs.environment == 'prod'
        run: |
          echo "::error::force_destroy_rds is not allowed in production"
          exit 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-infra-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Force Delete Conflicting Secrets
        run: |
          set -e
          for SECRET in "${{ env.ENVIRONMENT }}-db-password" "${{ env.ENVIRONMENT }}-db-username" "${{ env.ENVIRONMENT }}-db-name" "${{ env.ENVIRONMENT }}-grafana-admin-password"; do
            ARN=$(aws secretsmanager list-secrets --region "$AWS_REGION" --query "SecretList[?Name=='$SECRET'].ARN" --output text)
            if [ -n "$ARN" ]; then
              DELETION_DATE=$(aws secretsmanager describe-secret --secret-id "$ARN" --region "$AWS_REGION" --query 'DeletedDate' --output text 2>/dev/null || echo "None")
              if [ "$DELETION_DATE" != "None" ]; then
                aws secretsmanager restore-secret --secret-id "$ARN" --region "$AWS_REGION"
                sleep 2
              fi
              echo "Force deleting: $SECRET"
              aws secretsmanager delete-secret --secret-id "$ARN" --region "$AWS_REGION" --force-delete-without-recovery || true
            fi
          done

      - name: Bootstrap Terraform Backend
        run: |
          set -e
          BUCKET="ericchiu-terraform-state"
          TABLE="terraform-state-lock"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region $AWS_REGION
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi
          if ! aws dynamodb describe-table --table-name "$TABLE" --region $AWS_REGION 2>/dev/null; then
            aws dynamodb create-table --table-name "$TABLE" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST --region $AWS_REGION
            aws dynamodb wait table-exists --table-name "$TABLE" --region $AWS_REGION
          fi

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=ericchiu-terraform-state" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Terraform Plan & Apply
        working-directory: terraform/environments/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_grafana_admin_password }}
        run: |
          terraform plan -out=tfplan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="skip_monitoring=${{ github.event.inputs.skip_monitoring || 'false' }}"
          terraform apply -auto-approve tfplan

      - name: Print Outputs
        working-directory: terraform/environments/dev
        run: |
          echo "## Infrastructure Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # 5. SMOKE TESTS — after app or infra deploy
  # ──────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    needs: [deploy-app, deploy-infrastructure]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (needs.deploy-app.result == 'success' || needs.deploy-infrastructure.result == 'success')

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-test-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB DNS
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" \
            --query "LoadBalancers[?contains(LoadBalancerName,'${{ env.ENVIRONMENT }}-alb') && !contains(LoadBalancerName,'monitoring')].DNSName | [0]" --output text)
          MON_ALB_DNS=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" \
            --query "LoadBalancers[?contains(LoadBalancerName,'${{ env.ENVIRONMENT }}-monitoring')].DNSName | [0]" --output text)
          echo "alb_dns=${ALB_DNS}" >> $GITHUB_OUTPUT
          echo "mon_alb_dns=${MON_ALB_DNS}" >> $GITHUB_OUTPUT

      - name: Test Endpoints
        run: |
          set +e
          ALB="${{ steps.alb.outputs.alb_dns }}"
          MON="${{ steps.alb.outputs.mon_alb_dns }}"
          PASSED=0; FAILED=0

          echo "## Smoke Tests" >> $GITHUB_STEP_SUMMARY

          # Frontend
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB" 2>/dev/null)
            if [[ "$CODE" =~ ^(200|301|302)$ ]]; then
              echo "- Frontend: HTTP $CODE" | tee -a $GITHUB_STEP_SUMMARY
              ((PASSED++)); break
            fi
            sleep 15
          done
          [[ "$CODE" =~ ^(200|301|302)$ ]] || { echo "- Frontend: FAILED" | tee -a $GITHUB_STEP_SUMMARY; ((FAILED++)); }

          # Backend
          for i in $(seq 1 20); do
            if curl -f -s "http://$ALB/api/health" > /dev/null 2>&1; then
              echo "- Backend API: OK" | tee -a $GITHUB_STEP_SUMMARY
              ((PASSED++)); break
            fi
            sleep 15
          done
          curl -f -s "http://$ALB/api/health" > /dev/null 2>&1 || { echo "- Backend API: FAILED" | tee -a $GITHUB_STEP_SUMMARY; ((FAILED++)); }

          # Monitoring
          if [ -n "$MON" ] && [ "$MON" != "None" ]; then
            for i in $(seq 1 10); do
              curl -f -s "http://$MON/prometheus/-/healthy" > /dev/null 2>&1 && { echo "- Prometheus: OK" | tee -a $GITHUB_STEP_SUMMARY; ((PASSED++)); break; }
              sleep 10
            done
            for i in $(seq 1 10); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$MON/grafana/api/health" 2>/dev/null)
              [[ "$CODE" =~ ^(200|401|302)$ ]] && { echo "- Grafana: HTTP $CODE" | tee -a $GITHUB_STEP_SUMMARY; ((PASSED++)); break; }
              sleep 10
            done
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Passed: $PASSED | Failed: $FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: http://$ALB" >> $GITHUB_STEP_SUMMARY
          [ -n "$MON" ] && [ "$MON" != "None" ] && echo "- **Grafana**: http://$MON/grafana" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # 6. DESTROY — manual only
  # ──────────────────────────────────────────────
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Block force_destroy_rds in production
        if: github.event.inputs.force_destroy_rds == 'true' && github.event.inputs.environment == 'prod'
        run: |
          echo "::error::force_destroy_rds is not allowed in production"
          exit 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=ericchiu-terraform-state" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Scale Down ECS Services
        continue-on-error: true
        run: |
          set +e
          CLUSTER="${{ env.ENVIRONMENT }}"
          SERVICES=$(aws ecs list-services --cluster "$CLUSTER" --region $AWS_REGION --query 'serviceArns[*]' --output text 2>/dev/null)
          SERVICE_NAMES=""
          for ARN in $SERVICES; do
            NAME=$(basename "$ARN")
            aws ecs update-service --cluster "$CLUSTER" --service "$NAME" --desired-count 0 --region $AWS_REGION --no-cli-pager 2>/dev/null
            SERVICE_NAMES="$SERVICE_NAMES $NAME"
          done
          [ -n "$SERVICE_NAMES" ] && aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICE_NAMES --region $AWS_REGION --cli-connect-timeout 300 2>/dev/null || true

      - name: Clean ECR Repositories
        continue-on-error: true
        run: |
          set +e
          for REPO in "${{ env.ENVIRONMENT }}-frontend" "${{ env.ENVIRONMENT }}-backend"; do
            if aws ecr describe-repositories --repository-names "$REPO" --region $AWS_REGION &>/dev/null; then
              IMAGES=$(aws ecr list-images --repository-name "$REPO" --region $AWS_REGION --query 'imageIds' --output json)
              COUNT=$(echo "$IMAGES" | jq 'length')
              [ "$COUNT" -gt 0 ] && aws ecr batch-delete-image --repository-name "$REPO" --image-ids "$IMAGES" --region $AWS_REGION --no-cli-pager 2>/dev/null
            fi
          done

      - name: Create RDS Final Snapshot
        id: snapshot
        continue-on-error: true
        if: github.event.inputs.force_destroy_rds != 'true'
        run: |
          set +e
          RDS_ID="${{ env.ENVIRONMENT }}-db"
          SNAP_ID="${{ env.ENVIRONMENT }}-final-$(date +%Y%m%d-%H%M%S)"
          if aws rds describe-db-instances --db-instance-identifier "$RDS_ID" --region $AWS_REGION &>/dev/null; then
            aws rds create-db-snapshot --db-instance-identifier "$RDS_ID" --db-snapshot-identifier "$SNAP_ID" --region $AWS_REGION --no-cli-pager
            aws rds wait db-snapshot-completed --db-snapshot-identifier "$SNAP_ID" --region $AWS_REGION --cli-connect-timeout 600 2>/dev/null
            echo "snapshot=$SNAP_ID" >> $GITHUB_OUTPUT
          fi

      - name: Deregister Service Discovery Instances
        continue-on-error: true
        run: |
          set +e
          NAMESPACE=$(aws servicediscovery list-namespaces --region $AWS_REGION \
            --query "Namespaces[?Name=='${{ env.ENVIRONMENT }}.local'].Id | [0]" --output text)
          [ -z "$NAMESPACE" ] || [ "$NAMESPACE" = "None" ] && exit 0
          SERVICES=$(aws servicediscovery list-services --region $AWS_REGION \
            --filters "Name=NAMESPACE_ID,Values=$NAMESPACE" --query 'Services[*].Id' --output text)
          for SVC_ID in $SERVICES; do
            INSTANCES=$(aws servicediscovery list-instances --service-id "$SVC_ID" --region $AWS_REGION --query 'Instances[*].Id' --output text)
            for INST_ID in $INSTANCES; do
              aws servicediscovery deregister-instance --service-id "$SVC_ID" --instance-id "$INST_ID" --region $AWS_REGION 2>/dev/null
            done
          done
          sleep 10

      - name: Terraform Destroy
        working-directory: terraform/environments/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_grafana_admin_password }}
        run: |
          EXTRA_VARS=""
          [ "${{ github.event.inputs.force_destroy_rds }}" = "true" ] && EXTRA_VARS='-var="skip_final_snapshot=true"'
          terraform destroy -auto-approve \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="skip_monitoring=${{ github.event.inputs.skip_monitoring || 'false' }}" \
            $EXTRA_VARS

      - name: Destroy Summary
        if: always()
        run: |
          echo "## Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "Environment: **${{ env.ENVIRONMENT }}**" >> $GITHUB_STEP_SUMMARY
          SNAP="${{ steps.snapshot.outputs.snapshot }}"
          [ -n "$SNAP" ] && echo "RDS Snapshot: \`$SNAP\`" >> $GITHUB_STEP_SUMMARY
