name: Docker Security Scanning

on:
  push:
    tags: ["v*"]
    branches:
      - "main"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  SHA: ${{ github.event.pull_request.head.sha || github.event.after }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    strategy:
      matrix:
        component: [frontend, backend]

    env:
      REGISTRY: docker.io
      IMAGE_NAME: |
        ${{
          matrix.component == 'frontend' && 'iericchiu0228/containerized-3-tier-application-frontend' ||
          matrix.component == 'backend' && 'iericchiu0228/containerized-3-tier-application-backend'
        }}
      SHA: ${{ github.event.pull_request.head.sha || github.event.after }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          tags: |
            type=raw,value=latest
            type=raw,value=main

      - name: Build and Push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Run Docker Scout vulnerability scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ steps.meta.outputs.tags }}
          only-severities: critical,high
          exit-code: true
        continue-on-error: true

      - name: Generate SBOM with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: sbom
          image: ${{ steps.meta.outputs.tags }}
          output: sbom-${{ matrix.component }}.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.json
          retention-days: 30

      - name: Compare image to base
        uses: docker/scout-action@v1
        if: github.event_name == 'pull_request'
        with:
          command: compare
          image: ${{ steps.meta.outputs.tags }}
          to: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.component }}:latest
          exit-code: false

      - name: Push Docker image (on main branch)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true


  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [security-scan]

    steps:
      - name: Generate Summary
        run: |
          echo "## 🔒 Docker Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Details" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Vulnerability scanning completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM generation completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Provenance attestation generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 See [Docker Scout Dashboard](https://scout.docker.com) for detailed results" >> $GITHUB_STEP_SUMMARY