events {
    worker_connections 1024;           # Handle up to 1024 concurrent connections
}

http {
    # MIME Types & Logging
    include /etc/nginx/mime.types;     # Proper file type handling
    access_log /var/log/nginx/access.log;
    
    # Performance Optimizations
    sendfile on;                       # Efficient file serving
    gzip on;                          # Compress responses (faster loading)
    gzip_types application/javascript text/css;
    
    server {
        listen 80;                     # Listen on port 80
        root /usr/share/nginx/html;    # Serve React build files from here
        
        # Security Headers (Enterprise-grade security)
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self'";
        
        # Static Assets (Optimized caching)
        location ~* \.(js|css|png|jpg)$ {
            expires 1y;               # Cache static files for 1 year
            add_header Cache-Control "public, immutable";
        }
        
        # React Router Support (SPA routing)
        location / {
            try_files $uri $uri/ /index.html;  # Serve index.html for all routes
        }
        
        # Health Check Endpoint
        location /health {
            return 200 "healthy\n";
        }
        
        # API Proxy (Route /api/* to backend)
        location /api/ {
            proxy_pass http://backend:3001/;    # Forward API calls to backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}