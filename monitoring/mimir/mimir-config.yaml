multitenancy_enabled: false

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks

compactor:
  data_dir: /data/compactor

distributor:
  pool:
    health_check_ingesters: true

ingester:
  ring:
    final_sleep: 0s
    num_tokens: 512
    kvstore:
      store: memberlist

memberlist:
  bind_port: 7946
  join_members:
    - mimir:7946

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler

server:
  http_listen_port: 9009
  grpc_listen_port: 9095

store_gateway:
  sharding_enabled: false