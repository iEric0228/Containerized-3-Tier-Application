server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://grafana-lgtm:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      
      # Add job label based on container name (for Loki queries)
      - source_labels: ['__meta_docker_container_name']
        regex: '.*backend.*'
        target_label: 'job'
        replacement: 'backend'
      
      - source_labels: ['__meta_docker_container_name']
        regex: '.*frontend.*'
        target_label: 'job'
        replacement: 'frontend'
      
      - source_labels: ['__meta_docker_container_name']
        regex: '.*postgres.*'
        target_label: 'job'
        replacement: 'postgres'
      
      # Add service label based on container name
      - source_labels: ['__meta_docker_container_name']
        regex: '.*backend.*'
        target_label: 'service'
        replacement: 'backend'
      
      - source_labels: ['__meta_docker_container_name']
        regex: '.*frontend.*'
        target_label: 'service'
        replacement: 'frontend'
      
      - source_labels: ['__meta_docker_container_name']
        regex: '.*postgres.*'
        target_label: 'service'
        replacement: 'postgres'
      
      # Add tier label
      - source_labels: ['service']
        regex: 'backend'
        target_label: 'tier'
        replacement: 'backend'
      
      - source_labels: ['service']
        regex: 'frontend'
        target_label: 'tier'
        replacement: 'frontend'
      
      - source_labels: ['service']
        regex: 'postgres'
        target_label: 'tier'
        replacement: 'database'
      
      # Add application label
      - target_label: 'app'
        replacement: '3-tier-app'
      
      - target_label: 'environment'
        replacement: 'development'
