apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
    version: 1

  # Loki datasource (from LGTM stack)
  - name: Loki
    type: loki
    access: proxy
    url: http://grafana-lgtm:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
    version: 1

  # Tempo datasource (from LGTM stack)
  - name: Tempo
    type: tempo
    access: proxy
    url: http://grafana-lgtm:4317
    editable: true
    version: 1

  # Mimir datasource (from LGTM stack)
  - name: Mimir
    type: prometheus
    access: proxy
    url: http://grafana-lgtm:9009/prometheus
    editable: true
    jsonData:
      httpMethod: POST
    version: 1
