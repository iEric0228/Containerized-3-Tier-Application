# Docker Compose configuration for 3-tier web application with monitoring

services:
  # Database Tier
  postgres:
    image: postgres:15-alpine           # Lightweight PostgreSQL image
    container_name: postgres
    environment:                        # Database configuration
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: ["127.0.0.1:5432:5432"]      # Bind to localhost only
    volumes:                           # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:                       # Database health monitoring
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
    networks:
      - app-network
    restart: unless-stopped

  # PostgreSQL metrics exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Backend Tier
  backend:
    build:                             # Build from local Dockerfile
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:                       # Runtime environment variables
      - NODE_ENV=production
      - DB_HOST=postgres               # Service-to-service communication
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-app_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_SSL=false                    # Local only; production uses DB_SSL=true with RDS SSL
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOKI_HOST=http://grafana-lgtm:3100  # Send logs to Loki
      - LOKI_URL=http://grafana-lgtm:3100
    ports:
      - "3001:3001"                   # Backend API served on port 3001
    depends_on:                        # Start order dependency
      postgres:
        condition: service_healthy
      grafana-lgtm:
        condition: service_started
    healthcheck:                       # API health monitoring
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
    networks:
      - app-network
    restart: unless-stopped

  # Frontend Tier
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports: ["3000:80"]                 # React app served on port 3000
    depends_on: [backend]              # Requires backend to be running
    networks:
      - app-network
    restart: unless-stopped



  # Standalone Prometheus
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - app-network
    restart: unless-stopped

  # Promtail for log collection
  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
    networks:
      - app-network
    depends_on:
      - grafana-lgtm
    restart: unless-stopped

  # Grafana LGTM Stack (includes Grafana, Loki, Tempo, Mimir)
  grafana-lgtm:
    image: grafana/otel-lgtm:0.7.1
    container_name: grafana-lgtm
    ports:
      - "3002:3000"   # Grafana UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "3100:3100"   # Loki
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_lgtm_data:/data
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json:ro
    networks:
      - app-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_lgtm_data:
  prometheus_data:
  postgres_data:  

networks:
  app-network:                         # Isolated network for all services
    driver: bridge
