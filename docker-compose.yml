version: '3.8'  # Docker Compose file format version

services:
  # Database Tier
  postgres:
    image: postgres:15-alpine           # Lightweight PostgreSQL image
    environment:                        # Database configuration
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]               # Host:Container port mapping
    volumes:                           # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:                       # Database health monitoring
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    networks:
      - app-network

  # Backend Tier  
  backend:
    build:                             # Build from local Dockerfile
      context: ./backend
      dockerfile: Dockerfile
    environment:                       # Runtime environment variables
      - NODE_ENV=production
      - DB_HOST=postgres               # Service-to-service communication
      - DB_PORT=5432
      - DB_NAME=app_db
      - DB_USER=postgres
      - DB_PASSWORD=password
    depends_on:                        # Start order dependency
      postgres:
        condition: service_healthy
    healthcheck:                       # API health monitoring
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
    
    networks:
      - app-network

  # Frontend Tier
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:80"]                 # React app served on port 3000
    depends_on: [backend]              # Requires backend to be running
    networks:
      - app-network

  # Prometheus (metrics scraping)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - app-network

  # Grafana (metrics visualization)
  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "3100:3100"   # Loki (optional)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_lgtm_data:/data
    networks:
      - app-network

networks:
  app-network:                         # Isolated network for all services
    driver: bridge

volumes:
  postgres_data:                       # Named volume for PostgreSQL data
  grafana_lgtm_data: